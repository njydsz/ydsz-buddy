# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@njydsz/ydb-system-prompt'

- id: tools
  name: '@njydsz/ydb-tools'

- id: subprocess
  name: '@njydsz/ydb-subprocess-local'

- id: bash
  name: '@njydsz/ydb-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@njydsz/ydb-shell-env'

- id: tasks
  name: '@njydsz/ydb-jobs-local'

- id: tool-jobs
  name: '@njydsz/ydb-tool-jobs'

- id: tool-pwsh
  name: '@njydsz/ydb-tool-pwsh'
