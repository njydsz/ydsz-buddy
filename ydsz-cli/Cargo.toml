[package]
name = "ydsz-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ydsz-buddy"
path = "src/main.rs"

[dependencies]
# 基础
ydsz-core = { workspace = true }

# 双模式共享基础设施
ydsz-shared = { workspace = true }

# 业务核心
ydsz-flow = { workspace = true }
