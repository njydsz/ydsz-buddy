# Code / Work 域
ydsz-code = { workspace = true }
ydsz-work = { workspace = true }

# WS RPC 门面
ydsz-server = { workspace = true }

# 异步
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
