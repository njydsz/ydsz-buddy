[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "ydsz-buddy-sdk"
version = "0.0.0.dev0"
description = "Python SDK for Ydsz Buddy"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "njydsz" }]
dependencies = [
  "pydantic>=2.12,<3",
  "ydsz-buddy-runtime-bin==0.0.0.dev0",
]

[project.urls]
Homepage = "https://github.com/njydsz/ydsz-buddy"
Documentation = "https://github.com/njydsz/ydsz-buddy/blob/master/docs/user/guide/python-sdk.md"
Issues = "https://github.com/njydsz/ydsz-buddy/issues"
Source = "https://github.com/njydsz/ydsz-buddy"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ydsz_buddy"]

# Editable installs see runtime executables injected after installation instead
# of freezing a wheel snapshot.
[tool.uv.sources]
ydsz-buddy-runtime-bin = { path = "../sdk-runtime", editable = true }
