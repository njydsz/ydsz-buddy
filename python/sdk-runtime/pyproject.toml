[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "ydsz-buddy-runtime-bin"
version = "0.0.0.dev0"
description = "Pinned Ydsz Buddy runtime for the Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "njydsz" }]

[project.urls]
Homepage = "https://github.com/njydsz/ydsz-buddy"
Documentation = "https://github.com/njydsz/ydsz-buddy/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/njydsz/ydsz-buddy/issues"
Source = "https://github.com/njydsz/ydsz-buddy"

# Include the injected executable and default config; exclude the dev-only node
# closure from wheels and sdists.
[tool.hatch.build]
artifacts = ["src/ydsz_buddy_runtime/runtime/ydb-jsonrpc-agent-*"]
exclude = ["src/ydsz_buddy_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/ydsz_buddy_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
