[package]
name = "remi-code"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "remi_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
git2 = "0.18"
portable-pty = "0.8"
dirs = "5.0"
open = "5.0"
chrono = "0.4"

# Remi workspace modules
remi-core = { path = "../../../remi-core" }
remi-persistence = { path = "../../../remi-persistence" }
remi-orchestration = { path = "../../../remi-orchestration" }
remi-provider = { path = "../../../remi-provider" }
remi-git = { path = "../../../remi-git" }
remi-terminal = { path = "../../../remi-terminal" }
remi-workspace = { path = "../../../remi-workspace" }
remi-auth = { path = "../../../remi-auth" }
remi-config = { path = "../../../remi-config" }
remi-telemetry = { path = "../../../remi-telemetry" }
remi-checkpoint = { path = "../../../remi-checkpoint" }
remi-server = { path = "../../../remi-server" }

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!
custom-protocol = ["tauri/custom-protocol"]

[workspace]
