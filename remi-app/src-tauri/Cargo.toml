[package]
name = "remi-claw"
version = "0.2.0"
description = "Remi Claw - 双模式 AI 桌面助手 (Work / Code)"
authors = ["you"]
edition = "2021"

[lib]
name = "remi_claw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
git2 = "0.18"
portable-pty = "0.8"
dirs = "5.0"
open = "5.0"
chrono = "0.4"
url = "2"
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
which = "6.0"
base64 = "0.22"

# Remi 工作区模块依赖
remi-core = { path = "../../remi-core" }
remi-config = { path = "../../remi-config" }
remi-persistence = { path = "../../remi-persistence" }
remi-orchestration = { path = "../../remi-orchestration" }
remi-provider = { path = "../../remi-provider" }
remi-git = { path = "../../remi-git" }
remi-terminal = { path = "../../remi-terminal" }
remi-workspace = { path = "../../remi-workspace" }
remi-auth = { path = "../../remi-auth" }
remi-checkpoint = { path = "../../remi-checkpoint" }
remi-telemetry = { path = "../../remi-telemetry" }
remi-server = { path = "../../remi-server" }

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!
custom-protocol = ["tauri/custom-protocol"]

[workspace]
