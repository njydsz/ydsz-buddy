[package]
name = "remi-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri shell for Remi Code — hosts the React UI and embeds the remi-server backend"
authors = ["Remi Code Contributors"]
default-run = "remi-app"

[lib]
name = "remi_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"

# Remi Code backend crates — embedded directly so the Tauri shell owns
# the lifecycle of the HTTP/WS server, providers, auth, and orchestration
# without spawning a separate process.
remi-core.workspace = true
remi-contracts.workspace = true
remi-persistence.workspace = true
remi-rpc.workspace = true
remi-workspace.workspace = true
remi-git.workspace = true
remi-pty.workspace = true
remi-auth.workspace = true
remi-providers.workspace = true
remi-orchestration.workspace = true
remi-server.workspace = true

tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
rand.workspace = true
uuid.workspace = true

[features]
# this feature is used for production builds or when `devUrl` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
