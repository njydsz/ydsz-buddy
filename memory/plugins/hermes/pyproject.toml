[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ydsz-memory-hermes"
version = "0.3.0"
description = "Hermes MemoryProvider installer for ydszmemory backed by ydsz-memory."
readme = "ydszmemory/README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "orcakit" }]
keywords = ["hermes", "memory", "agent", "llm", "ydsz-memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.0",
    "ydsz-memory[cli]>=0.9.2",
]

[project.scripts]
ydsz-memory-hermes = "ydszmemory.installer:main"
ydszmemory-hermes = "ydszmemory.installer:main"

[project.urls]
Homepage = "https://github.com/TencentCloud/ydsz-memory"
Repository = "https://github.com/TencentCloud/ydsz-memory"
Issues = "https://github.com/TencentCloud/ydsz-memory/issues"

[tool.hatch.build.targets.wheel]
packages = ["ydszmemory"]

[tool.hatch.build.targets.wheel.force-include]
"ydszmemory/plugin.yaml" = "ydszmemory/plugin.yaml"
"ydszmemory/README.md" = "ydszmemory/README.md"

[tool.hatch.build.targets.sdist]
include = [
    "ydszmemory",
    "pyproject.toml",
]
