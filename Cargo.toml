[workspace]
resolver = "2"
members = [
    "crates/remi-core",
    "crates/remi-contracts",
    "crates/remi-persistence",
    "crates/remi-rpc",
    "crates/remi-workspace",
    "crates/remi-git",
    "crates/remi-pty",
    "crates/remi-auth",
    "crates/remi-providers",
    "crates/remi-orchestration",
    "crates/remi-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Remi Code-AI/Remi Code"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.45", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }

# Web framework
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", features = ["chrono", "url", "uuid1"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"

# Git
git2 = "0.20"

# PTY
portable-pty = "0.8"

# Utilities
uuid = { version = "1.15", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.10"
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
dashmap = "6.1"

# Configuration
figment = { version = "0.10", features = ["env", "toml"] }

# Crypto
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.9"
hex = "0.4"

# Testing
tokio-test = "0.4"
mockall = "0.13"

# Internal crates
remi-core = { path = "crates/remi-core" }
remi-contracts = { path = "crates/remi-contracts" }
remi-persistence = { path = "crates/remi-persistence" }
remi-rpc = { path = "crates/remi-rpc" }
remi-workspace = { path = "crates/remi-workspace" }
remi-git = { path = "crates/remi-git" }
remi-pty = { path = "crates/remi-pty" }
remi-auth = { path = "crates/remi-auth" }
remi-providers = { path = "crates/remi-providers" }
remi-orchestration = { path = "crates/remi-orchestration" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1

[workspace.lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
